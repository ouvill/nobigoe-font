name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_run:
    workflows:
      - Build and publish release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install site dependencies
        working-directory: website
        run: npm ci

      - name: Restore generated webfonts
        id: webfont-cache
        uses: actions/cache@v4
        with:
          path: website/src/assets/fonts/*.woff2
          key: astro-webfonts-v1-${{ hashFiles('font_profiles.py', 'website/src/**/*.astro', 'website/src/data/site.ts', 'website/public/marks-data.json') }}

      - name: Set up Python
        if: steps.webfont-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install webfont dependencies
        if: steps.webfont-cache.outputs.cache-hit != 'true'
        run: python -m pip install -r requirements.txt

      - name: Download released fonts
        if: steps.webfont-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python -c 'from font_profiles import VERSION_NUMBER; print(VERSION_NUMBER)')
          mkdir -p /tmp/font-release
          gh release download "v${version}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.zip' \
            --dir /tmp/font-release
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          destination = Path("/tmp/font-release/fonts")
          destination.mkdir(exist_ok=True)
          archives = sorted(Path("/tmp/font-release").glob("*.zip"))
          if len(archives) != 2:
              raise SystemExit(f"Expected two release ZIPs, found {len(archives)}")
          for archive in archives:
              with ZipFile(archive) as release:
                  for member in release.infolist():
                      path = Path(member.filename)
                      if "Fonts" not in path.parts or path.suffix not in {".otf", ".ttf"}:
                          continue
                      (destination / path.name).write_bytes(release.read(member))
          PY

      - name: Build webfonts
        if: steps.webfont-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p website/src/assets/fonts
          python - <<'PY'
          import json
          from pathlib import Path

          marks = json.loads(Path("website/public/marks-data.json").read_text(encoding="utf-8"))
          catalog_text = "".join(
              str(mark.get(key, ""))
              for mark in marks
              for key in ("glyph", "base", "mark")
          )
          Path("/tmp/weight-showcase.txt").write_text(
              "声を、どこまでも。Voice, ever onward." + catalog_text,
              encoding="utf-8",
          )
          PY
          pyftsubset /tmp/font-release/fonts/NobigoeMincho-Regular.otf \
            --output-file=website/src/assets/fonts/NobigoeMincho-Regular.woff2 \
            --flavor=woff2 \
            --glyphs='*' \
            --layout-features='*' \
            --name-IDs='*' \
            --name-languages='*' \
            --notdef-glyph \
            --notdef-outline \
            --recommended-glyphs
          pyftsubset /tmp/font-release/fonts/NobigoeKoburiMincho-Regular.ttf \
            --output-file=website/src/assets/fonts/NobigoeKoburiMincho-Regular-showcase.woff2 \
            --flavor=woff2 \
            --glyphs='*' \
            --layout-features='*' \
            --name-IDs='*' \
            --name-languages='*' \
            --notdef-glyph \
            --notdef-outline \
            --recommended-glyphs
          for weight in ExtraLight Light Medium SemiBold Bold Black; do
            pyftsubset "/tmp/font-release/fonts/NobigoeMincho-${weight}.otf" \
              --output-file="website/src/assets/fonts/NobigoeMincho-${weight}-showcase.woff2" \
              --flavor=woff2 \
              --text-file=/tmp/weight-showcase.txt \
              --layout-features='*' \
              --name-IDs='*' \
              --name-languages='*' \
              --notdef-glyph \
              --notdef-outline \
              --recommended-glyphs
          done

      - name: Build vertical specimen PDF
        working-directory: website
        run: npm run build:specimen

      - name: Check and build Astro site
        working-directory: website
        run: |
          npm run check
          npm run build

      - name: Verify static site
        run: |
          test -f website/site-dist/index.html
          test -f website/site-dist/tester/index.html
          test -f website/site-dist/glyphs/index.html
          test -f website/site-dist/marks-data.json
          test -f website/site-dist/nobigoe-mincho-vertical-specimen.pdf
          test -n "$(find website/site-dist/_assets -name '*.woff2' -print -quit)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
