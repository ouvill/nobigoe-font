name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Build and publish release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release_ready:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.release.outputs.available }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check matching release assets
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(PYTHONPATH=src python3 -c 'from nobigoe_font.profiles import VERSION_NUMBER; print(VERSION_NUMBER)')
          tag="v${version}"
          release_json=""
          if release_json=$(gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets 2>/dev/null
          ); then
            if RELEASE_JSON="$release_json" VERSION="$version" python3 - <<'PY'
          import json
          import os

          version = os.environ["VERSION"]
          expected = {
              f"NobigoeMincho-v{version}.zip",
              f"NobigoeKoburiMincho-v{version}.zip",
              f"NobigoeNovelMincho-v{version}.zip",
          }
          release = json.loads(os.environ["RELEASE_JSON"])
          actual = {
              asset["name"]
              for asset in release["assets"]
              if asset["name"].endswith(".zip")
          }
          if actual != expected:
              missing = sorted(expected - actual)
              unexpected = sorted(actual - expected)
              raise SystemExit(
                  f"Release ZIP mismatch: missing={missing}, unexpected={unexpected}"
              )
          PY
            then
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "Found all three release ZIPs for $tag"
              exit 0
            fi
          fi

          echo "available=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "::notice::Deferring Pages deployment until all three release ZIPs for $tag are published"
            exit 0
          fi

          echo "::error::All three release ZIPs for $tag must exist before deploying Pages"
          exit 1

  build:
    needs: release_ready
    if: needs.release_ready.outputs.available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install site dependencies
        working-directory: website
        run: npm ci

      - name: Install image renderer
        working-directory: website
        run: npx playwright install --with-deps chromium

      - name: Restore generated webfonts
        id: webfont-cache
        uses: actions/cache@v4
        with:
          path: website/src/assets/fonts/*.woff2
          key: astro-webfonts-v3-${{ hashFiles('src/nobigoe_font/profiles.py', 'src/nobigoe_font/novel.py', '.github/workflows/pages.yml', 'website/src/**/*.astro', 'website/src/data/site.ts', 'website/public/marks-data.json', 'website/tools/share-images.html') }}

      - name: Set up uv
        if: steps.webfont-cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install webfont dependencies
        if: steps.webfont-cache.outputs.cache-hit != 'true'
        run: uv sync --locked

      - name: Download released fonts
        if: steps.webfont-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(uv run python -c 'from nobigoe_font.profiles import VERSION_NUMBER; print(VERSION_NUMBER)')
          mkdir -p /tmp/font-release
          gh release download "v${version}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.zip' \
            --dir /tmp/font-release
          uv run python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          destination = Path("/tmp/font-release/fonts")
          destination.mkdir(exist_ok=True)
          archives = sorted(Path("/tmp/font-release").glob("*.zip"))
          if len(archives) != 3:
              raise SystemExit(f"Expected three release ZIPs, found {len(archives)}")
          for archive in archives:
              with ZipFile(archive) as release:
                  for member in release.infolist():
                      path = Path(member.filename)
                      if "Fonts" not in path.parts or path.suffix not in {".otf", ".ttf"}:
                          continue
                      (destination / path.name).write_bytes(release.read(member))
          PY

      - name: Build webfonts
        if: steps.webfont-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p website/src/assets/fonts
          uv run python - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path

          class VisibleTextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hidden_depth = 0
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  if tag in {"style", "script"}:
                      self.hidden_depth += 1

              def handle_endtag(self, tag):
                  if tag in {"style", "script"}:
                      self.hidden_depth -= 1

              def handle_data(self, data):
                  if self.hidden_depth == 0:
                      self.parts.append(data)

          marks = json.loads(Path("website/public/marks-data.json").read_text(encoding="utf-8"))
          catalog_text = "".join(
              str(mark.get(key, ""))
              for mark in marks
              for key in ("glyph", "base", "mark")
          )
          parser = VisibleTextParser()
          parser.feed(Path("website/tools/share-images.html").read_text(encoding="utf-8"))
          hiragana = (
              "".join(chr(codepoint) for codepoint in range(0x3041, 0x3097))
              + "\u3099\u309a"
              + "".join(chr(codepoint) for codepoint in range(0x309D, 0x30A0))
              + "\U0001B132"
          )
          Path("/tmp/weight-showcase.txt").write_text(
              "声を、どこまでも。Voice, ever onward."
              + "春の雨が野の道をぬらし、遠い家の灯りがゆっくり揺れていた。"
              + "夜はまだ静かに続いている。"
              + "永漢字山川雨月語本"
              + hiragana
              + catalog_text
              + "".join(parser.parts),
              encoding="utf-8",
          )
          PY
          uv run pyftsubset /tmp/font-release/fonts/NobigoeMincho-Regular.otf \
            --output-file=website/src/assets/fonts/NobigoeMincho-Regular.woff2 \
            --flavor=woff2 \
            --glyphs='*' \
            --layout-features='*' \
            --name-IDs='*' \
            --name-languages='*' \
            --notdef-glyph \
            --notdef-outline \
            --recommended-glyphs
          uv run pyftsubset /tmp/font-release/fonts/NobigoeKoburiMincho-Regular.ttf \
            --output-file=website/src/assets/fonts/NobigoeKoburiMincho-Regular-showcase.woff2 \
            --flavor=woff2 \
            --glyphs='*' \
            --layout-features='*' \
            --name-IDs='*' \
            --name-languages='*' \
            --notdef-glyph \
            --notdef-outline \
            --recommended-glyphs
          for weight in ExtraLight Light Medium SemiBold Bold Black; do
            uv run pyftsubset "/tmp/font-release/fonts/NobigoeMincho-${weight}.otf" \
              --output-file="website/src/assets/fonts/NobigoeMincho-${weight}-showcase.woff2" \
              --flavor=woff2 \
              --text-file=/tmp/weight-showcase.txt \
              --layout-features='*' \
              --name-IDs='*' \
              --name-languages='*' \
              --notdef-glyph \
              --notdef-outline \
              --recommended-glyphs
          done
          for weight in ExtraLight Light Regular Medium SemiBold Bold Black; do
            uv run pyftsubset "/tmp/font-release/fonts/NobigoeNovelMincho-${weight}.otf" \
              --output-file="website/src/assets/fonts/NobigoeNovelMincho-${weight}-showcase.woff2" \
              --flavor=woff2 \
              --text-file=/tmp/weight-showcase.txt \
              --layout-features='*' \
              --name-IDs='*' \
              --name-languages='*' \
              --notdef-glyph \
              --notdef-outline \
              --recommended-glyphs
          done

      - name: Verify Novel showcase webfonts
        run: |
          for weight in ExtraLight Light Regular Medium SemiBold Bold Black; do
            webfont="website/src/assets/fonts/NobigoeNovelMincho-${weight}-showcase.woff2"
            if [[ ! -s "$webfont" ]]; then
              echo "::error::Missing Novel showcase webfont: $webfont"
              exit 1
            fi
          done

      - name: Build vertical specimen PDF
        working-directory: website
        run: npm run build:specimen

      - name: Check and build Astro site
        working-directory: website
        run: |
          npm run build:images
          npm run check
          npm run build

      - name: Verify static site
        run: |
          test -f website/site-dist/index.html
          test -f website/site-dist/tester/index.html
          test -f website/site-dist/glyphs/index.html
          test -f website/site-dist/compare/index.html
          test -f website/site-dist/marks-data.json
          test -f website/site-dist/nobigoe-mincho-vertical-specimen.pdf
          test -n "$(find website/site-dist/_assets -name '*.woff2' -print -quit)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
