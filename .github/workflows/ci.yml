name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: |
          uv run python -m compileall -q src tests
          uv run python -m unittest discover -s tests
          uv run nobigoe-build --help >/dev/null
          uv run nobigoe-build-variable --help >/dev/null
          uv run nobigoe-package --help >/dev/null

      - name: Build distribution
        run: uv build

      - name: Verify packaged configuration data
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel, = Path("dist").glob("*.whl")
          expected = {
              "nobigoe_font/stix_latin_tuning.json",
              "nobigoe_font/version.json",
          }
          expected.update(
              path.relative_to("src").as_posix()
              for path in Path("src/nobigoe_font/mark_positions").rglob("*.json")
          )
          with ZipFile(wheel) as archive:
              packaged = set(archive.namelist())
          missing = sorted(expected - packaged)
          if missing:
              raise SystemExit("Missing packaged data: " + ", ".join(missing))
          print(f"Verified {len(expected)} packaged configuration files")
          PY

  font-smoke:
    name: Font build smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true
          save-cache: false

      - name: Cache pinned font sources
        uses: actions/cache@v6.1.0
        with:
          path: .cache/font-sources
          key: font-sources-${{ runner.os }}-${{ hashFiles('src/nobigoe_font/profiles.py', 'src/nobigoe_font/sources.py') }}
          restore-keys: |
            font-sources-${{ runner.os }}-

      - name: Install font validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes libharfbuzz-bin opentype-sanitizer

      - name: Install dependencies
        run: uv sync --locked

      - name: Build representative fonts
        run: |
          uv run nobigoe-build-variable \
            --output /tmp/NobigoeVariableMarks-VF.otf \
            --novel-output /tmp/NobigoeNovelMincho-VF.otf \
            --static-output-dir /tmp \
            --static-weight Regular \
            --autohint
          uv run nobigoe-build-essential \
            --source /tmp/NobigoeVariableMarks-VF.otf \
            --output /tmp/NobigoeEssential-VF.otf
          uv run nobigoe-build \
            --base koburi \
            --output /tmp/NobigoeKoburiMincho-Regular.ttf

      - name: Build GSUB diagnostic subsets
        run: |
          uv run python - <<'PY'
          from fontTools import subset
          from fontTools.ttLib import TTFont

          groups = {
              "core": ["ccmp", "liga"],
              "stylistic": ["ss01", "ss02", "ss03", "ss04", "ss05"],
              "contextual": ["calt"],
              "vertical": ["vert", "vrt2"],
              "vert-only": ["vert"],
              "vrt2-only": ["vrt2"],
              "contextual-vertical": ["calt", "vert", "vrt2"],
          }
          for label, features in groups.items():
              font = TTFont("/tmp/NobigoeVariableMarks-VF.otf")
              options = subset.Options()
              options.layout_features = features
              options.name_IDs = ["*"]
              subsetter = subset.Subsetter(options=options)
              subsetter.populate(glyphs=font.getGlyphOrder())
              subsetter.subset(font)
              font.save(f"/tmp/diagnostic-{label}.otf")
              font.close()

          source_lookup_count = len(TTFont(".cache/font-sources/NotoSerifJP-VF.otf")["GSUB"].table.LookupList.Lookup)
          generated = TTFont("/tmp/NobigoeVariableMarks-VF.otf")
          lookup_count = len(generated["GSUB"].table.LookupList.Lookup)
          custom_lookup_limit = lookup_count - source_lookup_count - 8
          feature_records = generated["GSUB"].table.FeatureList.FeatureRecord
          vert_features = [
              record.Feature for record in feature_records if record.FeatureTag == "vert"
          ]
          vrt2_features = [
              record.Feature for record in feature_records if record.FeatureTag == "vrt2"
          ]
          for vert, vrt2 in zip(vert_features, vrt2_features, strict=True):
              source_indices = [
                  index for index in vrt2.LookupListIndex if index >= custom_lookup_limit
              ]
              vrt2.LookupListIndex = source_indices
              vrt2.LookupCount = len(source_indices)
          generated.save("/tmp/diagnostic-vrt2-source-lookups.otf")
          for vert, vrt2 in zip(vert_features, vrt2_features, strict=True):
              shared_indices = [
                  index for index in vert.LookupListIndex if index < custom_lookup_limit
              ]
              vrt2.LookupListIndex = shared_indices + vrt2.LookupListIndex
              vrt2.LookupCount = len(vrt2.LookupListIndex)
          generated.save("/tmp/diagnostic-vrt2-shared-lookups.otf")
          generated.close()
          PY

      - name: Validate representative fonts
        run: |
          ots-sanitize \
            /tmp/NobigoeMincho-Regular.otf \
            /tmp/NobigoeMincho-Regular-sanitized.otf
          ots-sanitize \
            /tmp/NobigoeNovelMincho-Regular.otf \
            /tmp/NobigoeNovelMincho-Regular-sanitized.otf
          ots-sanitize \
            /tmp/NobigoeKoburiMincho-Regular.ttf \
            /tmp/NobigoeKoburiMincho-Regular-sanitized.ttf
          ots-sanitize \
            /tmp/NobigoeVariableMarks-VF.otf \
            /tmp/NobigoeVariableMarks-VF-sanitized.otf
          ots-sanitize \
            /tmp/NobigoeNovelMincho-VF.otf \
            /tmp/NobigoeNovelMincho-VF-sanitized.otf
          ots-sanitize \
            /tmp/NobigoeEssential-VF.otf \
            /tmp/NobigoeEssential-VF-sanitized.otf
          hb-shape \
            /tmp/NobigoeMincho-Regular.otf \
            "AVATAR あーーー！？" \
            --features=kern,liga,calt,ccmp >/dev/null
          hb-shape \
            /tmp/NobigoeNovelMincho-Regular.otf \
            "春の雨が静かに続く。あ゙ーーー！？" \
            --features=kern,liga,calt,ccmp >/dev/null
          hb-shape \
            /tmp/NobigoeVariableMarks-VF.otf \
            "ーーーー　――――　〜〜〜〜　〰〰〰〰" \
            --variations=wght=550 >/dev/null
          hb-shape \
            /tmp/NobigoeVariableMarks-VF.otf \
            "ーーーー　――――　〜〜〜〜　〰〰〰〰" \
            --variations=wght=550 \
            --direction=ttb >/dev/null
          hb-shape \
            /tmp/NobigoeNovelMincho-VF.otf \
            "春の雨が静かに続く。あ゙ーーー！？" \
            --variations=wght=550 \
            --features=kern,liga,calt,ccmp >/dev/null
          hb-shape \
            /tmp/NobigoeNovelMincho-VF.otf \
            "春の雨が静かに続く。あ゙ーーー！？" \
            --variations=wght=550 \
            --direction=ttb \
            --features=calt,vert,vrt2,ccmp >/dev/null
          hb-shape \
            /tmp/NobigoeKoburiMincho-Regular.ttf \
            "待ってーーー。" \
            --direction=ttb \
            --features=calt,vert,vrt2 >/dev/null

      - name: Upload Windows load-test fonts
        uses: actions/upload-artifact@v6
        with:
          name: windows-load-test-fonts
          path: |
            /tmp/NobigoeMincho-Regular.otf
            /tmp/NobigoeVariableMarks-VF.otf
            /tmp/NobigoeEssential-VF.otf
            /tmp/diagnostic-*.otf
          if-no-files-found: error

  font-windows:
    name: Windows font load test
    runs-on: windows-latest
    needs: font-smoke
    steps:
      - name: Download representative fonts
        uses: actions/download-artifact@v7
        with:
          name: windows-load-test-fonts
          path: fonts

      - name: Load fonts with Windows GDI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public static class FontLoader
          {
              [DllImport("gdi32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern int AddFontResourceEx(
                  string fileName,
                  uint flags,
                  IntPtr reserved
              );

              [DllImport("gdi32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern bool RemoveFontResourceEx(
                  string fileName,
                  uint flags,
                  IntPtr reserved
              );
          }
          "@
          $rejected = @()

          Get-ChildItem fonts -File -Recurse | ForEach-Object {
              $loaded = [FontLoader]::AddFontResourceEx(
                  $_.FullName,
                  0x10,
                  [IntPtr]::Zero
              )
              $errorCode = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
              if ($loaded -eq 0) {
                  Write-Host "Windows rejected $($_.Name) (Win32 error $errorCode)"
                  $rejected += $_.Name
                  return
              }
              try {
                  Write-Host "Windows loaded $($_.Name)"
              }
              finally {
                  [void][FontLoader]::RemoveFontResourceEx(
                      $_.FullName,
                      0x10,
                      [IntPtr]::Zero
                  )
              }
          }

          if ($rejected.Count -ne 0) {
              throw "Windows rejected: $($rejected -join ', ')"
          }

  website:
    name: Website checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check Astro project
        run: npm run check
