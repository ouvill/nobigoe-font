[project]
name = "nobigoe-font"
dynamic = ["version"]
description = "Build Nobigoe Mincho font families"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "afdko==5.0.1",
    "brotli==1.2.0",
    "fonttools==4.63.0",
    "skia-pathops==0.9.2",
]

[project.scripts]
nobigoe-build = "nobigoe_font.cli:main"
nobigoe-build-variable = "nobigoe_font.variable_cli:main"
nobigoe-package = "nobigoe_font.release:main"
nobigoe-measure-kana = "nobigoe_font.novel_metrics:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/nobigoe_font/version.json"
pattern = '"version"\s*:\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/nobigoe_font"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
]
